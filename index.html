<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Calorie Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div><small>DIARIO ALIMENTARE</small><h1>Calorie Tracker</h1></div>
  <button id="settingsBtn" class="ghost">⚙️</button>
</header>
<main>
  <section class="hero"><div><span>Oggi</span><strong><b id="remaining">1800</b> kcal</strong><small>rimanenti</small></div><div class="ring" id="ring"><span id="ringPct">0%</span></div></section>
  <section class="stats"><div><small>Consumate</small><b id="consumed">0</b><span> kcal</span></div><div><small>Obiettivo</small><b id="goalView">1800</b><span> kcal</span></div></section>
  <nav class="tabs"><button class="active" data-tab="today">Oggi</button><button data-tab="add">＋ Aggiungi</button><button data-tab="history">Storico</button><button data-tab="weight">Peso</button></nav>
  <section id="today" class="panel active"><div class="sectionTitle"><h2>Pasti</h2><span id="todayDate"></span></div><div id="mealList" class="list"></div><p id="emptyMeals" class="empty">Nessun alimento inserito oggi.</p></section>
  <section id="add" class="panel"><h2>Aggiungi alimento</h2><label>Nome prodotto<input id="foodName" placeholder="es. Pancakes"></label><label>Marca<input id="brand" placeholder="es. Pasquier"></label><div class="row"><label>Quantità<input id="qty" type="number" min="0.1" step="0.1" value="1"></label><label>Unità<select id="unit"><option value="portion">porzione/pezzo</option><option value="g">grammi</option></select></label></div><button id="searchBtn" class="primary">Cerca prodotto</button><p id="searchStatus" class="hint"></p><div id="results" class="results"></div><details><summary>Inserimento manuale</summary><div class="manual"><label>Calorie totali<input id="manualKcal" type="number" min="0"></label><div class="row3"><label>Proteine g<input id="manualProtein" type="number" min="0" step=".1"></label><label>Carbo g<input id="manualCarbs" type="number" min="0" step=".1"></label><label>Grassi g<input id="manualFat" type="number" min="0" step=".1"></label></div><button id="manualAdd" class="secondary">Aggiungi manualmente</button></div></details></section>
  <section id="history" class="panel"><h2>Storico</h2><div id="historyList" class="list"></div></section>
  <section id="weight" class="panel"><h2>Peso</h2><div class="row"><label>Peso (kg)<input id="weightInput" type="number" min="30" max="300" step=".1" placeholder="84.0"></label><button id="saveWeight" class="primary compact">Salva</button></div><div id="weightList" class="list"></div></section>
</main>
<dialog id="settings"><form method="dialog"><h2>Impostazioni</h2><label>Obiettivo calorico giornaliero<input id="goalInput" type="number" min="1000" max="5000" step="10" value="1800"></label><p class="hint">Il target iniziale è 1.800 kcal. Modificalo solo se necessario.</p><div class="dialogActions"><button value="cancel" class="ghost">Annulla</button><button id="saveGoal" value="default" class="primary">Salva</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
